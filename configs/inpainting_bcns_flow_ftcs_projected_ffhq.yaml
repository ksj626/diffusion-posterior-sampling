conditioning:
  method: bcns_target
  params:
    scale: 1.0
    target_builder: flow_structure
    target_builder_params:
      tau2: 1.0
      lambda_structure: 0.05
      structure_sigma: 1.0
      prox_steps: 1
      prox_step_size: 0.05
      initial_mode: projected_mu
      boundary_mode: normalized_known_smooth
      boundary_vorticity_mode: none
      integrator: ftcs
      poisson_method: sor_rb
      poisson_max_iter: 100
      poisson_tol: 1.0e-4
      poisson_omega: 1.7
      h: 1.0
      dt: 1.0e-4
      pseudo_time: 5.0e-4
      nu: 0.1
      kappa: 0.1
      smoothing_sigma: 1.0
      cfl: 0.25
      check_cfl: true
      vorticity_boundary_mode: none
    gamma_max: 0.02
    tau2: 1.0
    pde_start_frac: 0.7
    ramp_power: 2.0
    apply_noisy_known_projection: true
    apply_every_n_steps: 10
    reuse_last_target: false
    debug: false

data:
  name: ffhq
  root: ./data/samples/

measurement:
  operator:
    name: inpainting
  mask_opt:
    mask_type: random
    mask_prob_range: !!python/tuple [0.3, 0.7]
    image_size: 256

  noise:
    name: clean
