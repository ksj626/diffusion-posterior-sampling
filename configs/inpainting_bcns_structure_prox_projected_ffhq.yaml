conditioning:
  method: bcns_target
  params:
    scale: 1.0
    target_builder: structure_prox
    target_builder_params:
      tau2: 1.0
      lambda_structure: 0.05
      structure_sigma: 1.0
      prox_steps: 1
      prox_step_size: 0.05
      target_mode: normalized_known_smooth
    gamma_max: 0.02
    tau2: 1.0
    pde_start_frac: 0.7
    ramp_power: 2.0
    apply_noisy_known_projection: true
    debug: false

data:
  name: ffhq
  root: ./data/samples/

measurement:
  operator:
    name: inpainting
  mask_opt:
    mask_type: random
    mask_prob_range: !!python/tuple [0.3, 0.7]
    image_size: 256

  noise:
    name: clean
